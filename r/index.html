<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>قدّها · السر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&family=Almarai:wght@400;700;800&display=swap">
<style>
:root{--bg:#efece6;--ink:#1f1e1c;--paper:#fbfaf7;--stamp:#b0402c;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Almarai','Segoe UI',Tahoma,sans-serif;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 22px;border-radius:22px;background:var(--paper);border:3px solid var(--ink);text-align:center}
.card.blurred>*:not(button){filter:blur(16px)}
.brand{margin:0;font-family:'Rakkas',serif;font-size:1.6rem;line-height:1}
.type{margin:0;font-weight:800}
.word{margin:0;font-family:'Rakkas',serif;font-weight:400;font-size:clamp(2.6rem,13vw,4.4rem);line-height:1.15;overflow-wrap:anywhere}
.extra{margin:0;font-weight:800;font-size:1.1rem}
.ban{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.ban small{width:100%;font-weight:800;color:var(--stamp)}
.ban span{padding:2px 10px;border-radius:99px;border:2px solid var(--stamp);color:var(--stamp);font-weight:800}
.note{margin:0;font-size:.92rem;line-height:1.6}
button{font:inherit;font-weight:800;min-height:48px;padding:.5em 1.4em;border-radius:14px;border:3px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
button:focus-visible{outline:3px solid var(--stamp);outline-offset:3px}
</style>
</head>
<body>
<main class="card" id="card">
  <p class="brand">قدّها</p>
  <p class="note">امسحوا كود تحدّي من لعبة قدّها عشان يطلع السر هون.</p>
</main>
<script>
(function(){
  var LABEL={act:'مثّلها',hum:'دندنها',taboo:'بلا ما تقول'};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
  var h=location.hash||'',card=document.getElementById('card');
  if(h.indexOf('#s')!==0)return;
  var d;
  try{d=JSON.parse(b64d(h.slice(2)))}catch(e){card.innerHTML='<p class="brand">قدّها</p><p class="note">الكود مش واضح. امسحوه مرة ثانية.</p>';return}
  var html='<p class="brand">قدّها</p><p class="type">'+esc(LABEL[d.t]||'السر')+'</p><h1 class="word">'+esc(d.s)+'</h1>';
  if(d.t==='hum')html+='<p class="extra">الصوت: '+esc(d.k)+'</p>';
  if(d.t==='act')html+='<p class="extra">'+esc(d.k)+' · مثّل بدون ولا كلمة</p>';
  if(d.t==='taboo')html+='<div class="ban"><small>ممنوع تقول:</small>'+(d.b||[]).map(function(w){return'<span>'+esc(w)+'</span>'}).join('')+'</div>';
  html+='<p class="note">لا تفرجي حدا! لما تجهز، خلّيهم يضغطوا «يلا ابدأ» على الشاشة الكبيرة.</p><button type="button" id="hide">خبّي الشاشة</button>';
  card.innerHTML=html;
  history.replaceState(null,'',location.pathname);
  document.getElementById('hide').onclick=function(){card.classList.toggle('blurred');this.textContent=card.classList.contains('blurred')?'أظهر':'خبّي الشاشة'};
})();
</script>
</body>
</html>
