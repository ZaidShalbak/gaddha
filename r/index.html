<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>قدّها · السر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700;800;900&display=swap">
<style>
:root{--bg:#1d1913;--ink:#f4ecdc;--mut:#c9bda6;--g1:#14532d;--g2:#2f9e5f;--b:#f0475a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Alexandria','Segoe UI',Tahoma,sans-serif;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 22px;border-radius:28px;background:#2a241c;box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:center}
.card.blurred>*:not(button){filter:blur(16px)}
.brand{margin:0;font-weight:900;font-size:1.7rem;line-height:1.1;background:linear-gradient(90deg,#2f9e5f,#14532d);-webkit-background-clip:text;background-clip:text;color:transparent}
.type{margin:0;font-weight:800;background:rgba(47,158,95,.2);color:#5fd08f;padding:4px 14px;border-radius:99px}
.word{margin:0;font-weight:900;font-size:clamp(2.4rem,12vw,4.2rem);line-height:1.2;overflow-wrap:anywhere}
.extra{margin:0;font-weight:800;font-size:1.05rem}
.ban{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.ban small{width:100%;font-weight:800;color:var(--b)}
.ban span{padding:2px 12px;border-radius:99px;background:rgba(240,71,90,.2);color:#ff8a96;font-weight:800}
.note{margin:0;font-size:.9rem;line-height:1.7;color:var(--mut)}
button{font:inherit;font-weight:800;min-height:50px;padding:.4em 1.6em;border-radius:99px;border:0;background:linear-gradient(90deg,#2f9e5f,#14532d);color:#fff;cursor:pointer}
.draw{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.draw-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.draw-top b{font-weight:900}
.draw-top .peek{min-height:40px;padding:0 14px;font-size:.85rem;background:#2a241c;color:var(--ink);box-shadow:0 1px 4px rgba(22,22,22,.12);user-select:none;-webkit-user-select:none}
.draw-pad{flex:1;min-height:0;display:flex}
.live{font-size:.72rem;font-weight:800;text-align:center;color:var(--mut)}
.live.on{color:var(--g2)}
.small{min-height:40px;padding:0 14px;font-size:.85rem;background:#2a241c;color:var(--ink);box-shadow:0 1px 4px rgba(22,22,22,.12)}
button:focus-visible{outline:3px solid var(--g2);outline-offset:3px}
</style>
</head>
<body>
<main class="card" id="card">
  <p class="brand">قدّها</p>
  <p class="note">امسحوا كود تحدّي من لعبة قدّها عشان يطلع السر هون.</p>
</main>
<div class="draw" id="draw" hidden>
  <div class="draw-top"><button type="button" class="small" id="back">رجوع</button><b>ارسم… بلا حروف ولا أرقام</b><button type="button" class="peek" id="peek">اضغط مطوّل: الكلمة</button></div>
  <div class="draw-pad" id="pad"></div>
  <p class="live" id="live" hidden></p>
</div>
<script src="/pad.js"></script>
<script src="/sb.js"></script>
<script>
(function(){
  var LABEL={act:'مثّلها',hum:'دندنها',taboo:'بلا ما تقول',draw:'ارسمها',words:'بجملة وحدة'};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
  var h=location.hash||'',card=document.getElementById('card');
  if(h.indexOf('#s')!==0)return;
  var d;
  try{d=JSON.parse(b64d(h.slice(2)))}catch(e){card.innerHTML='<p class="brand">قدّها</p><p class="note">الكود مش واضح. امسحوه مرة ثانية.</p>';return}
  var html='<p class="brand">قدّها</p><p class="type">'+esc(LABEL[d.t]||'السر')+'</p><h1 class="word">'+esc(d.s)+'</h1>';
  if(d.t==='hum')html+='<p class="extra">الصوت: '+esc(d.k)+'</p>';
  if(d.t==='words')html+='<p class="extra">'+(d.k?esc(d.k)+' · ':'')+'وصّفها بـ3 كلمات بس!</p>';
  if(d.t==='act')html+='<p class="extra">'+esc(d.k)+' · مثّل بدون ولا كلمة</p>';
  if(d.t==='taboo')html+='<div class="ban"><small>ممنوع تقول:</small>'+(d.b||[]).map(function(w){return'<span>'+esc(w)+'</span>'}).join('')+'</div>';
  if(d.t==='draw'){
    html+='<p class="extra">'+esc(d.k||'')+(d.k?' · ':'')+'ارسم بلا حروف ولا أرقام</p><p class="note">إذا بترسم على الشاشة الكبيرة: احفظ الكلمة وروح ارسم هناك. إذا على الجوال: اضغط «ارسم هون» وخلّي فريقك يتجمّع حواليك.</p><button type="button" id="drawbtn">ارسم هون</button><button type="button" class="small" id="hide">خبّي الشاشة</button>';
  }else html+='<p class="note">لا تفرجي حدا! لما تجهز، خلّيهم يضغطوا «يلا ابدأ» على الشاشة الكبيرة.</p><button type="button" id="hide">خبّي الشاشة</button>';
  card.innerHTML=html;
  var db=document.getElementById('drawbtn');
  if(db){
    var dw=document.getElementById('draw'),pk=document.getElementById('peek'),strokes=[],inst=null;
    var SB=window.GADDHA_SB,ch=null,lv=document.getElementById('live');
    if(SB&&SB.configured()&&d.r){
      ch=SB.room('gaddha-draw-'+d.r);
      ch.on('hello',function(){if(inst)ch.send('d',{q:d.q,m:inst.snapshot()})});
      ch.onstatus=function(st){lv.hidden=false;lv.className='live'+(st==='on'?' on':'');lv.textContent=st==='on'?'● الرسمة عم تطلع على الشاشة الكبيرة':'الرسمة على هالجوال بس (ما في اتصال)'};
    }
    db.onclick=function(){card.hidden=true;dw.hidden=false;if(inst)inst.destroy();inst=window.GADDHA_PAD.create(document.getElementById('pad'),{strokes:strokes,onlive:ch?function(m){ch.send('d',{q:d.q,m:m})}:null});if(ch)ch.send('d',{q:d.q,m:inst.snapshot()})};
    document.getElementById('back').onclick=function(){dw.hidden=true;card.hidden=false};
    var show=function(e){e.preventDefault();pk.textContent=d.s},hide=function(){pk.textContent='اضغط مطوّل: الكلمة'};
    pk.addEventListener('pointerdown',show);pk.addEventListener('pointerup',hide);pk.addEventListener('pointerleave',hide);pk.addEventListener('pointercancel',hide);
    pk.addEventListener('contextmenu',function(e){e.preventDefault()});
  }
  history.replaceState(null,'',location.pathname);
  document.getElementById('hide').onclick=function(){card.classList.toggle('blurred');this.textContent=card.classList.contains('blurred')?'أظهر':'خبّي الشاشة'};
})();
</script>
</body>
</html>
