<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>قدّها · لوحة التحكم</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800;900&display=swap">
<style>
:root{--bg:#f7f5ef;--ink:#161616;--mut:#5b5a55;--line:#e4e1d8;--soft:#efece4;--g1:#14532d;--g2:#2f9e5f;--grad:linear-gradient(90deg,#2f9e5f,#14532d);--b:#f0475a;--bt:#fde4e6;--gt:#e6f2ea;--amb:#c48a12;--at:#fbf0d4;--sh:0 4px 14px rgba(22,22,22,.06);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Alexandria','Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.6}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.btn{font-weight:800;min-height:40px;padding:.3em 1.1em;border-radius:99px;border:0;background:#fff;box-shadow:0 1px 5px rgba(22,22,22,.1);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn.solid{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(20,83,45,.25)}
.btn.sm{min-height:32px;font-size:.82em;padding:.2em .9em}
.btn.danger{color:var(--b)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mut{color:var(--mut)}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--line)}
.top .in{max-width:1300px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.wm{font-weight:900;font-size:1.6em;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:99px}
.tabs button{border:0;background:none;padding:6px 16px;border-radius:99px;font-weight:800;font-size:.88em;cursor:pointer;color:var(--mut)}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.top .end{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.dirty{font-size:.8em;font-weight:700;color:var(--amb)}
main{max-width:1300px;margin:auto;padding:20px}
.card{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:16px 18px}
.login{max-width:560px;margin:40px auto;display:flex;flex-direction:column;gap:14px}
.login ol{margin:0;padding-inline-start:1.3em;color:var(--mut);font-size:.9em;display:flex;flex-direction:column;gap:4px}
input[type=text],input[type=password],input[type=email],input[type=number],textarea,select{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:.5em .8em}
textarea{resize:vertical;min-height:3.2em}
input:focus,textarea:focus,select:focus{border-color:var(--g2);outline:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78em;font-weight:700;color:var(--mut)}
label.f>input,label.f>textarea,label.f>select{font-size:1.25em;font-weight:600;color:var(--ink)}
.qlayout{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 96px);overflow:auto;padding-bottom:10px}
.side h3{font-size:.78em;font-weight:800;color:#fff;background:var(--gc);display:inline-block;padding:2px 12px;border-radius:99px;margin-bottom:6px}
.side .grp{display:flex;flex-direction:column;gap:4px}
.catbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:0;background:#fff;border-radius:14px;padding:6px 10px;cursor:pointer;box-shadow:var(--sh)}
.catbtn[aria-current="true"]{box-shadow:0 0 0 2.5px var(--g2)}
.catbtn .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.catbtn .ic svg{width:26px;height:26px}
.catbtn b{font-size:.86em;flex:1}
.catbtn .cnt{display:flex;gap:4px}
.badge{font-size:.68em;font-weight:800;padding:1px 7px;border-radius:99px}
.b-draft{background:var(--at);color:#7a5200}.b-reviewed{background:#e7eef7;color:#1d4e89}.b-published{background:var(--gt);color:var(--g1)}
.b-off{background:var(--soft);color:var(--mut)}
.qhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.qhead h2{font-weight:900;font-size:1.5em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:0;border-radius:99px;padding:4px 12px;font-size:.8em;font-weight:800;cursor:pointer;background:#fff;box-shadow:var(--sh)}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.qlist{display:flex;flex-direction:column;gap:10px}
.q{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-inline-start:5px solid var(--sc,#ddd)}
.q.s-draft{--sc:#e0a92a}.q.s-reviewed{--sc:#4a86d4}.q.s-published{--sc:var(--g2)}
.q .qt{font-weight:800;font-size:1.02em}
.q .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 16px;font-size:.84em}
.q .meta b{color:var(--mut);font-weight:700}
.q .ans{color:var(--g1);font-weight:900}
.q .src a{color:#1d4e89;font-size:.8em;word-break:break-all}
.q .actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:99px;padding:3px 12px;font-size:.78em;font-weight:800;cursor:pointer;color:var(--mut)}
.seg button[aria-pressed="true"].draft{background:#fff3d1;color:#7a5200}
.seg button[aria-pressed="true"].reviewed{background:#dbe8f7;color:#1d4e89}
.seg button[aria-pressed="true"].published{background:var(--g2);color:#fff}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit .wide{grid-column:1/-1}
.warn{font-size:.78em;font-weight:700;color:#b3263a}
.cats-tab{display:flex;flex-direction:column;gap:16px}
.gcard{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--gc)}
.gcard.off{opacity:.65}
.ghead{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ghead input[type=text]{max-width:260px;font-weight:900}
.swatches{display:flex;gap:4px}
.swatches button{width:24px;height:24px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.crow{display:grid;grid-template-columns:56px minmax(140px,1.4fr) 150px 130px auto auto;gap:10px;align-items:center;background:var(--bg);border-radius:16px;padding:8px 10px}
.crow.off{opacity:.55}
.crow .ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center}
.crow .ic svg{width:42px;height:42px}
.crow .counts{display:flex;gap:4px;flex-wrap:wrap}
.crow .cdesc{grid-column:2/-1}
.sw{display:inline-flex;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font-size:.78em;font-weight:700;color:var(--mut);padding:0}
.sw i{width:40px;height:23px;border-radius:99px;background:#d9d4c6;position:relative;display:block;flex:none;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:inset-inline-start .2s}
.sw[aria-checked="true"] i{background:var(--g2)}
.sw[aria-checked="true"] i::after{inset-inline-start:20px}
.arrows{display:flex;gap:2px}
.arrows button{width:30px;height:30px;border-radius:9px;border:0;background:#fff;box-shadow:var(--sh);cursor:pointer;font-weight:900}
.arrows button:disabled{opacity:.3}
.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:6px}
.artgrid button{border:0;border-radius:12px;padding:6px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:.66em;font-weight:700;gap:2px}
.artgrid button svg{width:38px;height:38px}
.artgrid button[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--g2);background:var(--gt)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:30;padding:16px}
.modal .card{width:min(640px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;padding:10px 18px;border-radius:14px;z-index:40;max-width:90vw;text-align:center}
.empty{padding:30px;text-align:center;color:var(--mut)}
@media (max-width:900px){.qlayout{grid-template-columns:1fr}.side{position:static;max-height:none}.crow{grid-template-columns:48px 1fr;}.crow .ic{width:48px;height:48px}.edit{grid-template-columns:1fr}}
.picf{display:flex;flex-direction:column;gap:8px}
.pv{width:200px;max-width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;position:relative;cursor:crosshair;background:#e7eef7;flex:none}
.pv img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.pv i{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid #fff;background:#f0475a;box-shadow:0 0 0 2px #161616;pointer-events:none}
.thumb{width:84px;aspect-ratio:4/3;border-radius:10px;object-fit:cover;flex:none}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:800;color:var(--g1,#14532d);text-decoration:underline;cursor:pointer}a.btn{text-decoration:none;color:inherit}
.fbstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.fbstats .card{text-align:center}.fbstats b{display:block;font-size:1.8em;font-weight:900;color:#14532d}.fbstats small{color:#5b5a55;font-weight:700;font-size:.8em}
.fbgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}@media(max-width:700px){.fbgrid,.fbstats{grid-template-columns:1fr}}
.fbrow{display:grid;grid-template-columns:130px 1fr 28px;gap:8px;align-items:center;font-size:.85em;margin-top:6px}.fbrow i{display:block;height:10px;border-radius:99px;background:linear-gradient(90deg,#2f9e5f,#14532d);width:var(--w);min-width:2px}.fbrow b{text-align:end}
.fbitem{border-top:1px solid #efece4;padding:10px 0;display:flex;flex-direction:column;gap:4px}.fbitem p{margin:0}.fbtag{display:inline-block;font-size:.75em;font-weight:800;background:#e6f2ea;color:#14532d;border-radius:99px;padding:2px 9px;margin:2px}.fbtag.pay{background:#fff3d1;color:#8a5a00}
.ktable{width:100%;border-collapse:collapse;font-size:.88em;margin-top:8px}.ktable th,.ktable td{text-align:start;padding:8px 6px;border-top:1px solid #efece4;vertical-align:middle}.ktable th{color:#5b5a55;font-weight:800;border-top:0}
</style>
</head>
<body>
<header class="top"><div class="in">
  <span class="wm">قدّها</span><span class="mut" style="font-weight:700">لوحة التحكم</span>
  <nav class="tabs" id="tabs" hidden>
    <button type="button" data-a="tab" data-t="q" aria-selected="true">الأسئلة</button>
    <button type="button" data-a="tab" data-t="c" aria-selected="false">الفئات والمجموعات</button>
    <button type="button" data-a="tab" data-t="f" aria-selected="false">السؤال الأخير</button>
    <button type="button" data-a="tab" data-t="k" aria-selected="false">الأكواد</button>
    <button type="button" data-a="tab" data-t="r" aria-selected="false">الآراء</button>
  </nav>
  <div class="end" id="topend" hidden>
    <span class="dirty" id="dirty"></span>
    <button type="button" class="btn solid" id="save" data-a="save" disabled>احفظ وانشر</button>
    <button type="button" class="btn sm ghost" data-a="logout">خروج</button>
  </div>
</div></header>
<main id="main"></main>
<div class="toast" id="toast" hidden></div>
<div id="modal"></div>
<script src="/art.js"></script>
<script src="/cats.js"></script>
<script src="/sb.js"></script>
<script>
(()=>{
const GA=window.GADDHA_ART;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const STATUS={draft:'مسودة',reviewed:'تمت المراجعة',published:'منشور'};
const TYPES={'':'أسئلة عادية',num:'أقرب رقم',order:'رتّبها',act:'مثّلها',hum:'دندنها',taboo:'بلا ما تقول',draw:'ارسمها',words:'بجملة وحدة',bid:'بزايد عليك'};
const tkey=m=>m.type||(m.mode==='num'||m.mode==='order'||m.mode==='bid'?m.mode:'');
const fmtN=n=>n==null||n===''?'':Number(n).toLocaleString('en-US',{maximumFractionDigits:3});
const GCOLORS=['#f0475a','#14532d','#161616','#c48a12','#2f9e5f','#1d4e89','#7b4dff','#c8743a'];
let ffilter='all',files={},dirty=new Set(),uploads={},previews={},tab='q',cur=null,filter='all',editing=null,toastT;

function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
/* questions live in Supabase (supabase/questions.sql). Only admins can read drafts or save. */
async function rpcA(name,args){
  const c=await GADDHA_SB.client();const ss=(await c.auth.getSession()).data.session;
  if(!ss){const e=new Error('login');e.code='login';throw e}
  const r=await c.rpc(name,args||{});
  if(r.error){const m=String(r.error.message||'');const e=new Error(m);
    e.code=/not admin/i.test(m)?'not_admin':(r.error.code==='PGRST202'||/could not find the function|does not exist/i.test(m))?'no_sql':/jwt|login/i.test(m)?'login':'';throw e}
  return r.data;
}
const b64blob=(b64,type)=>{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})};
const LISTKEYS=['questions','items','finals'];
const fileList=d=>{for(const k of LISTKEYS)if(Array.isArray(d&&d[k]))return d[k];return []};
const idx=()=>files['questions/index.json'];
const catFile=id=>'questions/'+(idx().categories.find(c=>c.id===id)||{}).file;
const catData=id=>files[catFile(id)];
const catMeta=id=>idx().categories.find(c=>c.id===id);
const listOf=id=>{const d=catData(id);return d?(d.items||d.questions||[]):[]};
function touch(p){dirty.add(p);paintDirty()}
function paintDirty(){const n=dirty.size+Object.keys(uploads).length;$('dirty').textContent=n?`${n} ${n===1?'ملف متغيّر':'ملفات متغيّرة'} · ما انحفظت`:'';$('save').disabled=!n}
window.addEventListener('beforeunload',e=>{if(dirty.size){e.preventDefault();e.returnValue=''}});

/* ---------- login + load ---------- */
let LASTMAIL='';
function paintLogin(err,extra){
  $('tabs').hidden=true;$('topend').hidden=true;
  $('main').innerHTML=`<div class="card login">
    <h1 style="font-weight:900;font-size:1.5em">دخول لوحة التحكم</h1>
    <p class="mut">ادخل بنفس حساب «قدّها» (الإيميل والكلمة السرّية). لازم يكون الحساب أدمن.</p>
    <label class="f wide">الإيميل<input type="email" id="amail" dir="ltr" autocomplete="email"></label>
    <label class="f wide">الكلمة السرّية<input type="password" id="apw" dir="ltr" autocomplete="current-password"></label>
    ${err?`<p class="warn">${esc(err)}</p>`:''}${extra||''}
    <div class="row"><button type="button" class="btn solid" data-a="login">دخول</button></div></div>`;
  const m=$('amail');m&&m.focus();
}
const ADMIN_SQL=e=>`<pre dir="ltr" style="white-space:pre-wrap;background:#f1ecdf;padding:10px;border-radius:10px;font-size:.8em">insert into public.admins(user_id) select id from auth.users where email = '${esc(e)}' on conflict do nothing;</pre>`;
async function loadErr(e){
  if(e.code==='login'||e.status===401)return paintLogin('سجّل دخول.');
  if(e.code==='not_admin'){let em='';try{const c=await GADDHA_SB.client();const u=(await c.auth.getUser()).data.user;em=u&&u.email||''}catch(x){}em=em||LASTMAIL;return paintLogin('هالحساب مش أدمن. شغّل هالسطر بـSupabase ← SQL Editor مرة وحدة، وبعدين ادخل كمان مرة:',ADMIN_SQL(em))}
  if(e.code==='no_sql')return paintLogin('لازم نجهّز قاعدة البيانات للأسئلة مرة وحدة:',`<ol style="font-size:.88em;line-height:1.9"><li>افتح ملف <a href="https://github.com/ZaidShalbak/gaddha/blob/main/supabase/questions.sql" target="_blank" rel="noopener">supabase/questions.sql</a> وانسخ كل اللي فيه.</li><li>Supabase ← SQL Editor ← New query ← الصق ← <b>Run</b>.</li><li>ارجع لهون وادخل كمان مرة.</li></ol>`);
  $('main').innerHTML=`<p class="empty">صار خطأ بالتحميل: ${esc(e.message)}</p>`;
}
function fixFiles(){
  idx().categories.forEach(c=>{const p='questions/'+c.file;if(!files[p])files[p]=c.type&&c.type!=='num'&&c.type!=='order'?{category:c.id,type:c.type,items:[]}:{category:c.id,questions:[]}});
  if(!files['questions/finals.json'])files['questions/finals.json']={finals:[]};
}
async function load(){
  $('main').innerHTML='<p class="empty">عم نحمّل الأسئلة…</p>';
  let b;
  try{b=await rpcA('admin_bank')}catch(e){return loadErr(e)}
  if(!b||!b.index)return paintImport();
  files={};dirty.clear();uploads={};
  files['questions/index.json']=b.index;
  Object.entries(b.files||{}).forEach(([f,d])=>files['questions/'+f]=d);
  fixFiles();
  $('tabs').hidden=false;$('topend').hidden=false;paintDirty();
  if(!cur||!catMeta(cur))cur=idx().categories[0]&&idx().categories[0].id;
  paint();
}
/* one time: copy the question files that ship with the site into the database */
function paintImport(err){
  $('tabs').hidden=true;$('topend').hidden=false;
  $('main').innerHTML=`<div class="card login"><h1 style="font-weight:900;font-size:1.4em">ننقل الأسئلة لقاعدة البيانات</h1>
    <p class="mut">قاعدة البيانات لسّا فاضية. بكبسة وحدة بننسخ كل الفئات والأسئلة الموجودة هلّأ (مع المسودات) لـSupabase. من بعدها كل تعديل بينحفظ هناك وبيطلع باللعبة فورًا.</p>
    ${err?`<p class="warn">${esc(err)}</p>`:''}<div class="row"><button type="button" class="btn solid" data-a="import">انقل الأسئلة</button></div></div>`;
}
async function importFiles(){
  const get=f=>fetch('/questions/'+f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.json()});
  const I=await get('index.json');const names=[...new Set(I.categories.map(c=>c.file).concat([I.finals||'finals.json']))];
  const all={};await Promise.all(names.map(async n=>{try{all[n]=await get(n)}catch(e){}}));
  const keys=Object.keys(all);let first=true;
  for(let i=0;i<keys.length||first;i+=8){const part={};keys.slice(i,i+8).forEach(k=>part[k]=all[k]);
    await rpcA('admin_save',{p_index:first?I:null,p_files:part});first=false;
    $('main').innerHTML=`<p class="empty">عم ننقل… ${Math.min(i+8,keys.length)} / ${keys.length}</p>`}
  return keys.length;
}
let saving=false;
async function uploadPics(){
  const c=await GADDHA_SB.client();
  for(const [p,b64] of Object.entries(uploads)){
    const name=p.split('/').pop();
    const up=await c.storage.from('qimg').upload(name,b64blob(b64,'image/jpeg'),{contentType:'image/jpeg',upsert:true});
    if(up.error)throw new Error('الصورة ما انرفعت: '+up.error.message);
    const url=c.storage.from('qimg').getPublicUrl(name).data.publicUrl;previews[url]=previews[p];
    Object.keys(files).forEach(f=>{if(f==='questions/index.json')return;fileList(files[f]).forEach(x=>{if(x.img==='/'+p){x.img=url;dirty.add(f)}})});
    delete uploads[p];

async function save(){

function syncOrder(){

async function shrink(file){
  const url=URL.createObjectURL(file);const im=new Image();im.src=url;await im.decode();
  const k=Math.min(1,1200/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg',.85);
}

  art(b){const m=catMeta(b.dataset.id);draftArt=m.art||m.id;draftBg=m.bg||GA.CBG[m.id]||GA.BGS[0];
    modal(`<h2 style="font-weight:900">صورة «${esc(m.name)}»</h2><div id="artbox">${artPicker(draftArt,draftBg)}</div>
      <div class="row"><button type="button" class="btn solid" data-a="set-art" data-id="${m.id}">تمام</button><button type="button" class="btn" data-a="close">إلغاء</button></div>`)},
  'set-art'(b){const m=catMeta(b.dataset.id),g=$('glyph').value.trim();m.art=g?'glyph:'+g:draftArt;m.bg=draftBg;touch('questions/index.json');closeModal();paint()},
  'pick-art'(b){draftArt=b.dataset.k;const g=$('glyph');if(g)g.value='';$('artbox').innerHTML=artPicker(draftArt,draftBg)},
  'pick-bg'(b){draftBg=b.dataset.c;const gv=$('glyph')?$('glyph').value:'';$('artbox').innerHTML=artPicker(draftArt,draftBg);$('glyph').value=gv},
  close:closeModal,
  focus(b,e){const x=findQ(b.dataset.id),r=b.getBoundingClientRect();x.f=`${Math.round((e.clientX-r.left)/r.width*100)}% ${Math.round((e.clientY-r.top)/r.height*100)}%`;touch(catFile(cur));paint()},
  'img-del'(b){const x=findQ(b.dataset.id),k=String(x.img||'').replace(/^\//,'');delete uploads[k];delete x.img;delete x.f;touch(catFile(cur));paint()},
  'modal-bg'(b,e){if(e.target===b)closeModal()},
  ffilter(b){ffilter=b.dataset.f;paint()},
  'new-f'(){const F=files['questions/finals.json'].finals,id=nextId('final',F),cat=ffilter==='all'?'':ffilter;F.push({id,status:'draft',cat,category:cat?(catMeta(cat)||{}).name:'',q:'',a:'',clues:['','',''],sources:[]});editing=id;touch('questions/finals.json');paint()},
  fstatus(b){files['questions/finals.json'].finals.find(x=>x.id===b.dataset.id).status=b.dataset.s;touch('questions/finals.json');paint()},
  fedit(b){editing=editing===b.dataset.id?null:b.dataset.id;paint()},
  fdel(b){if(!confirm('نحذفه؟'))return;const d=files['questions/finals.json'];d.finals=d.finals.filter(x=>x.id!==b.dataset.id);touch('questions/finals.json');paint()}
};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='apw'||e.target.id==='amail')&&A.login)A.login()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled||!A[b.dataset.a])return;A[b.dataset.a](b,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.e){const x=findQ(d.id);if(!x)return;const v=t.value;
    if(d.e==='h0'||d.e==='h1'){x.hints=x.hints||['',''];x.hints[+d.e[1]]=v}
    else if(d.e==='l'){x.l=v.split('\n').map(s=>s.trim()).filter(Boolean);if(!x.a||/^\d+ جواب$/.test(x.a))x.a=x.l.length+' جواب'}
    else if(d.e==='sources')x.sources=v.split('\n').map(s=>s.trim()).filter(Boolean);
    else if(d.e==='b')x.b=v.split(/[،,]/).map(s=>s.trim()).filter(Boolean);
    else if(d.e==='difficulty')x.difficulty=v?+v:null;
    else if(/^o\d[tv]$/.test(d.e)){x.o=x.o||[];const k=+d.e[1];x.o[k]=x.o[k]||{t:'',v:''};x.o[k][d.e[2]]=v;x.a=x.o.map(it=>it&&it.t).filter(Boolean).join(' ← ')}
    else if(d.e==='n'){const t=v.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[,٬\s]/g,'').replace('٫','.');x.n=t===''||isNaN(+t)?null:+t;x.a=(fmtN(x.n)+' '+(x.unit||'')).trim()}
    else if(d.e==='unit'){x.unit=v;x.a=(fmtN(x.n)+' '+v).trim()}
    else x[d.e]=v;
    touch(catFile(cur));return}
  if(d.fe){const x=files['questions/finals.json'].finals.find(y=>y.id===d.id),v=t.value;
    if(/^c[012]$/.test(d.fe)){x.clues=x.clues||['','',''];x.clues[+d.fe[1]]=v}
    else if(d.fe==='sources')x.sources=v.split('\n').map(s=>s.trim()).filter(Boolean);
    else if(d.fe==='cat'){x.cat=v;x.category=v?(catMeta(v)||{}).name:''}
    else x[d.fe]=v;
    touch('questions/finals.json');return}
  if(d.g==='name'){idx().groups[+d.gi].name=t.value;touch('questions/index.json');return}
  if(d.c==='name'){catMeta(d.id).name=t.value;touch('questions/index.json');return}
  if(d.c==='desc'){const m=catMeta(d.id),v=t.value.trim();if(v)m.desc=v;else delete m.desc;touch('questions/index.json');return}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.c==='group'){const G=idx().groups,to=+t.value;G.forEach(g=>g.categories=g.categories.filter(id=>id!==d.id));G[to].categories.push(d.id);touch('questions/index.json');paint()}
  if(d.fe==='cat'){const x=files['questions/finals.json'].finals.find(y=>y.id===d.id);x.cat=t.value;x.category=t.value?(catMeta(t.value)||{}).name:'';touch('questions/finals.json');paint();return}
  if(d.e==='difficulty'){const x=findQ(d.id);x.difficulty=t.value?+t.value:null;touch(catFile(cur))}
  if(d.up&&t.files&&t.files[0]){const x=findQ(d.up);toast('عم نجهّز الصورة…');
    shrink(t.files[0]).then(du=>{const old=String(x.img||'').replace(/^\//,'');delete uploads[old];
      const path=`questions/img/${x.id}-${Date.now().toString(36)}.jpg`;uploads[path]=du.split(',')[1];previews[path]=du;x.img='/'+path;if(!x.f)x.f='50% 35%';
      if(!x.q)x.q='مين هاد؟';touch(catFile(cur));paint();toast('الصورة جاهزة. اضغط «احفظ وانشر».')}).catch(()=>toast('ما قدرنا نقرأ الصورة.'))}
});
try{ls.del('gaddha.admin.token')}catch(e){}
GADDHA_SB.client().then(c=>c.auth.getSession()).then(r=>{r&&r.data&&r.data.session?load():paintLogin()}).catch(()=>paintLogin('ما قدرنا نتّصل.'));
})();
</script>
</body>
