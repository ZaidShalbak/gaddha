<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#8a4fd6">
<title>قدّنا؟ · اكتب سر</title>
<meta property="og:title" content="قدّنا؟ · اكتب سر للسهرة">
<meta property="og:description" content="اكتب سؤال إنت بتعرف جوابه… والباقي لازم يعرفوه.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700;800;900&display=swap">
<style>
:root{--bg:#f6effd;--ink:#161616;--mut:#5b5a55;--p:#8a4fd6;--pt:#efe5fb;--line:#e2d6f3;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Alexandria','Segoe UI',Tahoma,sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.brand{font-weight:900;font-size:1.3rem;color:var(--p)}
h1{margin:0;font-weight:900;font-size:1.7rem;line-height:1.3}
p{margin:0}
.mut{color:var(--mut);line-height:1.8;font-size:.92rem}
.card{background:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(138,79,214,.12)}
label{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:800;color:var(--mut)}
input,textarea{font:inherit;font-size:1.05rem;font-weight:600;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:.6em .8em;width:100%;resize:vertical;background:#fff}
input:focus,textarea:focus{outline:none;border-color:var(--p)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{font:inherit;font-size:.85rem;font-weight:800;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--p);border-color:var(--p);color:#fff}
.go{font:inherit;font-weight:900;font-size:1.05rem;min-height:56px;border-radius:99px;border:0;background:var(--p);color:#fff;cursor:pointer;box-shadow:0 10px 24px rgba(138,79,214,.3)}
.go:disabled{opacity:.5}
.err{color:#c92a3a;font-weight:800;font-size:.85rem}
.done{text-align:center;align-items:center}
.done .big{font-size:3rem}
.small{font-size:.75rem;color:var(--mut);text-align:center}
</style>
</head>
<body>
<main id="main">
  <span class="brand">قدّنا؟</span>
  <p class="mut" id="load">عم نحمّل…</p>
</main>
<script src="/sb.js"></script>
<script>
(function(){
  var KIND={family:'العيلة',friends:'الشلّة',work:'الشغل'},PH={family:'مثلاً: مين أول واحد بالعيلة ساق سيارة أبوه بدون ما يعرف؟',friends:'مثلاً: مين فينا ضاع بآخر رحلة وما اعترف؟',work:'مثلاً: مين بالمكتب بيشرب أكتر قهوة باليوم؟'};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var id=(location.hash||'').slice(1),SB=window.GADDHA_SB,main=document.getElementById('main'),info=null,team=-2;
  var ls={get:function(k){try{return localStorage.getItem(k)||''}catch(e){return''}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  function fail(t){main.innerHTML='<span class="brand">قدّنا؟</span><div class="card"><p class="mut">'+t+'</p></div>'}
  if(!id||!SB||!SB.configured())return fail('الرابط مش كامل. اطلبوا الرابط مرة تانية من اللي عامل السهرة.');
  SB.rpc('circle_info',{p_id:id}).then(function(r){if(!r)return fail('الرابط انتهى أو مش صحيح. اطلبوا رابط جديد.');info=r;form()}).catch(function(){fail('ما قدرنا نفتح الرابط. تأكدوا من الإنترنت وجرّبوا كمان مرة.')});
  function form(){
    var t=KIND[info.kind]||'العيلة';
    main.innerHTML='<span class="brand">قدّنا؟</span><h1>اكتب سر عن '+t+'</h1><p class="mut">سؤال إنت بتعرف جوابه… وهمّ لأ. بيضل مخفي لحد السهرة، وسؤالك ما بيطلع لفريقك.'+(info.count?' وصل لهلّأ <b>'+info.count+'</b> '+(info.count===1?'سر':'أسرار')+'.':'')+'</p>'
      +'<div class="card"><label>اسمك<input id="by" maxlength="24" autocomplete="off" value="'+esc(ls.get('gaddha.w.by'))+'"></label>'
      +'<div><label style="margin-bottom:6px">بأي فريق رح تلعب؟</label><div class="seg" id="team">'
      +[[0,'الفريق الأول'],[1,'الفريق الثاني'],[-2,'لسّا مش عارف'],[-1,'مش رح ألعب']].map(function(o){return'<button type="button" data-t="'+o[0]+'" aria-pressed="'+(o[0]===team)+'">'+o[1]+'</button>'}).join('')+'</div></div>'
      +'<label>السؤال<textarea id="q" rows="3" maxlength="180" placeholder="'+esc(PH[info.kind]||PH.family)+'"></textarea></label>'
      +'<label>الجواب<input id="a" maxlength="60" autocomplete="off"></label>'
      +'<label>غشّة (اختياري)<input id="h" maxlength="90" autocomplete="off" placeholder="تلميح صغير بيساعد"></label>'
      +'<label>القصة ورا السر (اختياري، بتطلع بعد الجواب)<textarea id="s" rows="2" maxlength="220"></textarea></label>'
      +'<p class="err" id="err" hidden></p><button class="go" id="send">ابعت السر</button></div><p class="small">ما حدا بيشوف جوابك غير لما ينكشف بالسهرة.</p>';
    document.getElementById('team').onclick=function(e){var b=e.target.closest('button');if(!b)return;team=+b.dataset.t;this.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(+x.dataset.t===team))})};
    document.getElementById('send').onclick=send;
  }
  function v(i){return(document.getElementById(i).value||'').trim()}
  function send(){
    var by=v('by'),q=v('q'),a=v('a'),err=document.getElementById('err');
    var bad=!by?'اكتب اسمك':q.length<3?'اكتب السؤال':!a?'اكتب الجواب':'';
    if(bad){err.textContent=bad;err.hidden=false;return}
    var btn=document.getElementById('send');btn.disabled=true;btn.textContent='عم نبعت…';ls.set('gaddha.w.by',by);
    SB.rpc('add_secret',{p_id:id,p_by:by,p_team:team,p_q:q,p_a:a,p_hint:v('h'),p_story:v('s')}).then(function(){
      info.count=(info.count||0)+1;
      main.innerHTML='<span class="brand">قدّنا؟</span><div class="card done"><span class="big">🤫</span><h1>انحفظ السر!</h1><p class="mut">بيضل مخفي لحد السهرة. وصل لهلّأ '+info.count+' '+(info.count===1?'سر':'أسرار')+'.</p><button class="go" id="more">اكتب سر تاني</button></div>';
      document.getElementById('more').onclick=form;
    }).catch(function(e){btn.disabled=false;btn.textContent='ابعت السر';err.textContent=/full/.test(e&&e.message)?'الرابط امتلى (200 سر). خلص!':'ما انبعت. تأكدوا من الإنترنت وجرّبوا كمان مرة.';err.hidden=false});
  }
})();
</script>
</body>
</html>
