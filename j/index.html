<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12211a">
<title>قدّها · الحكم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700;800;900&display=swap">
<style>
:root{--bg:#12211a;--g1:#14532d;--g2:#2f9e5f;--b:#f0475a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:'Alexandria','Segoe UI',Tahoma,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900;font-size:1.5rem;background:linear-gradient(90deg,#6fd39a,#2f9e5f);-webkit-background-clip:text;background-clip:text;color:transparent}
.st{font-size:.75rem;font-weight:800;color:#9fb1a6}.st.on{color:#6fd39a}
.card{background:#fff;color:#161616;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card small{color:#5b5a55;font-weight:800}
.card h1{margin:0;font-size:1.3rem;font-weight:900;line-height:1.5}
.count{text-align:center;font-weight:900;font-size:1.1rem}.count b{font-size:2.6rem;display:block;line-height:1.1}
.note{color:#b9c7be;text-align:center;line-height:1.8;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font:inherit;font-weight:800;font-size:1rem;min-height:50px;border-radius:14px;padding:0 14px;background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.22);cursor:pointer}
.chip.on{background:var(--g2);border-color:#6fd39a}
.chip:disabled{cursor:default}
.chips.preview .chip{min-height:40px;font-size:.9rem;opacity:.85}
input{font:inherit;font-size:1rem;width:100%;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;padding:12px 14px}
input::placeholder{color:#9fb1a6}
button.big{font:inherit;font-weight:900;font-size:1.15rem;min-height:58px;border-radius:99px;border:0;background:linear-gradient(90deg,#2f9e5f,#14532d);color:#fff;cursor:pointer;width:100%}
button.line{font:inherit;font-weight:800;min-height:50px;border-radius:99px;border:1.5px solid rgba(255,255,255,.3);background:none;color:#fff;cursor:pointer;width:100%}
.ok{background:#e6f2ea;color:#14532d;border-radius:16px;padding:12px;text-align:center;font-weight:800}
</style>
</head>
<body>
<main>
  <div class="top"><span class="brand">قدّها</span><span class="st" id="st">عم نتّصل…</span></div>
  <div id="view"><p class="note">عم نستنّى الشاشة الكبيرة…</p></div>
</main>
<script src="/sb.js"></script>
<script>
(function(){
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var room=(location.hash||'').slice(1),SB=window.GADDHA_SB,st=document.getElementById('st'),view=document.getElementById('view');
  if(!room||!SB||!SB.configured()){st.textContent='ما في كود';return}
  var ch=SB.room('gaddha-judge-'+room),s=null,lastAt=0,q='',sentReady='';
  ch.on('state',function(x){s=x;lastAt=Date.now();st.textContent='● متّصل';st.className='st on';paint()});
  ch.onstatus=function(v){if(v==='on')ch.send('hello',{});else if(v==='off'){st.textContent='انقطع الاتصال';st.className='st'}};
  setInterval(function(){if(Date.now()-lastAt>8000)ch.send('hello',{})},4000);
  function cmd(a,d){var p={act:a};if(d)for(var k in d)p[k]=d[k];ch.send('cmd',p);if(navigator.vibrate)navigator.vibrate(12)}
  var nz=function(t){return String(t).trim().replace(/^ال/,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')};
  function paint(){
    if(!s)return;var h='';
    if(s.phase==='idle'){view.innerHTML='<p class="note">إنتو الحكم لجولات «بزايد عليك». خلّوا الصفحة مفتوحة، ولما تبلّش جولة جديدة بتطلع القائمة هون.</p>';return}
    h+='<div class="card"><small>إنتو الحكم يا '+esc(s.judge)+'</small><h1>'+esc(s.prompt)+'</h1><small>'+esc(s.bidder)+' تعهّدوا بـ '+s.n+'</small></div>';
    if(s.phase==='judge'){
      h+='<p class="note">هاي القائمة الكاملة. ما حدا غيركم شايفها، فلا توريها لحدا.</p><div class="chips preview">'+s.list.map(function(it){return'<button class="chip" disabled>'+esc(it.t)+'</button>'}).join('')+'</div>';
      h+=s.ready?'<div class="ok">جاهزين ✓ استنّوا يبلّش العدّ على الشاشة الكبيرة</div><button class="line" data-a="start">ابدأ العدّ هلّأ</button>':'<button class="big" data-a="ready">شايفين القائمة، جاهزين</button>';
    }else if(s.phase==='go'){
      h+='<div class="count">'+esc(s.bidder)+'<b dir="ltr">'+s.count+' / '+s.n+'</b></div>';
      h+='<input type="search" id="q" placeholder="دوّروا بالقائمة…" value="'+esc(q)+'" autocomplete="off">';
      var v=nz(q);
      h+='<div class="chips">'+s.list.filter(function(it){return !v||nz(it.t).indexOf(v)===0||it.t.split(/\s+/).some(function(w){return nz(w).indexOf(v)===0})}).map(function(it){return'<button class="chip'+(it.on?' on':'')+'" data-i="'+it.i+'">'+esc(it.t)+'</button>'}).join('')+'</div>';
      h+='<button class="line" data-a="extra">+ جواب صح مش بالقائمة'+(s.extra?' ('+s.extra+')':'')+'</button><button class="line" data-a="stop">خلص الوقت / وقّفوا</button>';
    }else{
      h+='<div class="count">خلصت الجولة<b dir="ltr">'+s.count+' / '+s.n+'</b></div><p class="note">النتيجة على الشاشة الكبيرة. خلّوا الصفحة مفتوحة للجولة الجاية.</p>';
    }
    var f=document.activeElement&&document.activeElement.id==='q';
    view.innerHTML=h;
    if(f){var i=document.getElementById('q');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
  }
  view.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value;paint()}});
  view.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.i!=null){b.classList.toggle('on');cmd('tap',{i:+b.dataset.i});if(q){q='';}return}
    var a=b.dataset.a;if(!a)return;
    if(a==='extra'&&!confirm('جواب صح بس مش بالقائمة؟ نقبلها إذا الفريقين متّفقين.'))return;
    if(a==='stop'&&!confirm('توقّفوا الجولة هلّأ؟'))return;
    cmd(a);
  });
})();
</script>
</body>
</html>
